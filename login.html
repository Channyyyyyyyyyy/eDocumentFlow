<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign In — UPHSD Molino | Office of the School Director</title>
<link rel="stylesheet" href="shared.css" />

<style>
  /* =====================================================================
     LOGIN PAGE — STANDALONE STYLES
     (Does NOT use the shared dashboard layout — it's its own full screen)
     ===================================================================== */

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }

  html, body { height: 100%; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    position: relative;
    overflow: hidden;
    background: linear-gradient(135deg, #4a0a0c 0%, #7B1113 50%, #5A0C0E 100%);
    transition: background 0.5s ease;
  }

  /* =========================================================
     BACKGROUND IMAGE LAYER
     ========================================================= */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: 0;
    /* 👇 REPLACE WITH YOUR SCHOOL IMAGE: url('school-bg.jpg') */
    background-image: url('school-bg.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    filter: blur(6px) brightness(0.85);
    transform: scale(1.08);
    transition: filter 0.5s ease;
  }

  body.dark-mode::before {
    filter: blur(6px) brightness(0.4);
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    z-index: 1;
    background: linear-gradient(
      135deg,
      rgba(74, 10, 12, 0.88) 0%,
      rgba(123, 17, 19, 0.78) 50%,
      rgba(90, 12, 14, 0.88) 100%
    );
    pointer-events: none;
    transition: background 0.5s ease;
  }

  body.dark-mode::after {
    background: linear-gradient(
      135deg,
      rgba(10, 5, 5, 0.94) 0%,
      rgba(30, 8, 10, 0.92) 50%,
      rgba(15, 6, 7, 0.94) 100%
    );
  }

  /* =========================================================
     DARK MODE TOGGLE
     ========================================================= */
  .theme-toggle {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 10;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: 2px solid #D4AF37;
    background: rgba(123, 17, 19, 0.9);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    color: #D4AF37;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.35s ease;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
    overflow: hidden;
  }

  .theme-toggle:hover {
    transform: scale(1.1) rotate(15deg);
    background: rgba(212, 175, 55, 0.95);
    color: #7B1113;
    box-shadow: 0 8px 25px rgba(212, 175, 55, 0.55);
  }

  .theme-toggle svg {
    width: 22px;
    height: 22px;
    fill: currentColor;
    position: absolute;
    transition: opacity 0.3s ease, transform 0.4s ease;
  }

  .theme-toggle .icon-sun {
    opacity: 1;
    transform: rotate(0deg) scale(1);
  }
  .theme-toggle .icon-moon {
    opacity: 0;
    transform: rotate(-90deg) scale(0.5);
  }

  body.dark-mode .theme-toggle .icon-sun {
    opacity: 0;
    transform: rotate(90deg) scale(0.5);
  }
  body.dark-mode .theme-toggle .icon-moon {
    opacity: 1;
    transform: rotate(0deg) scale(1);
  }

  /* =========================================================
     LOGIN CARD
     ========================================================= */
  .login-container {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 440px;
    background: #FFFFFF;
    border-radius: 20px;
    padding: 45px 40px;
    box-shadow:
      0 25px 50px rgba(0, 0, 0, 0.55),
      0 0 0 4px rgba(212, 175, 55, 0.35);
    animation: fadeIn 0.7s ease;
    border-top: 6px solid #D4AF37;
    transition: background 0.5s ease, box-shadow 0.5s ease;
  }

  body.dark-mode .login-container {
    background: #1a1414;
    box-shadow:
      0 25px 50px rgba(0, 0, 0, 0.75),
      0 0 0 4px rgba(212, 175, 55, 0.5);
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(25px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* =========================================================
     LOGO AREA
     ========================================================= */
  .logo-area {
    text-align: center;
    margin-bottom: 30px;
  }

  .logo-circle {
    width: 110px;
    height: 110px;
    margin: 0 auto 18px;
    border-radius: 50%;
    background: #FFFFFF;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    box-shadow:
      0 10px 25px rgba(123, 17, 19, 0.25),
      0 0 0 4px #D4AF37,
      0 0 0 8px rgba(212, 175, 55, 0.2);
    position: relative;
    transition: background 0.5s ease, box-shadow 0.5s ease;
  }

  body.dark-mode .logo-circle {
    background: #2a1f1f;
    box-shadow:
      0 10px 25px rgba(0, 0, 0, 0.5),
      0 0 0 4px #D4AF37,
      0 0 0 8px rgba(212, 175, 55, 0.3);
  }

  .logo-circle img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    padding: 10px;
    display: block;
  }

  .logo-circle .fallback-icon {
    width: 55px;
    height: 55px;
    fill: #7B1113;
    display: none;
  }

  body.dark-mode .logo-circle .fallback-icon {
    fill: #D4AF37;
  }

  .logo-circle.img-failed img {
    display: none;
  }
  .logo-circle.img-failed .fallback-icon {
    display: block;
  }

  .logo-area h1 {
    color: #7B1113;
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 0.5px;
    line-height: 1.35;
    text-transform: uppercase;
    transition: color 0.5s ease;
  }

  body.dark-mode .logo-area h1 {
    color: #F4C430;
  }

  .logo-area .campus {
    color: #D4AF37;
    font-weight: 800;
  }

  .logo-area .subtitle {
    display: inline-block;
    margin-top: 10px;
    padding: 4px 14px;
    background: #7B1113;
    color: #D4AF37;
    font-size: 0.7rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    border-radius: 20px;
    font-weight: 600;
    transition: all 0.5s ease;
  }

  body.dark-mode .logo-area .subtitle {
    background: #D4AF37;
    color: #1a1414;
  }

  /* =========================================================
     FORM
     ========================================================= */
  .form-group {
    margin-bottom: 20px;
    position: relative;
  }

  .form-group label {
    display: block;
    color: #5A0C0E;
    font-size: 0.85rem;
    margin-bottom: 8px;
    font-weight: 600;
    transition: color 0.5s ease;
  }

  body.dark-mode .form-group label {
    color: #e8d9b0;
  }

  .input-wrapper {
    position: relative;
  }

  .input-wrapper input {
    width: 100%;
    padding: 14px 45px 14px 45px;
    background: #F9F5F0;
    border: 1.5px solid #e0d5c5;
    border-radius: 10px;
    color: #2b1a1a;
    font-size: 0.95rem;
    outline: none;
    transition: all 0.3s ease;
  }

  body.dark-mode .input-wrapper input {
    background: #2a1f1f;
    border-color: #3d2a2a;
    color: #f5ead5;
  }

  .input-wrapper input::placeholder {
    color: #a89a8a;
  }

  .input-wrapper input:focus {
    border-color: #7B1113;
    background: #FFFFFF;
    box-shadow: 0 0 0 4px rgba(123, 17, 19, 0.12);
  }

  body.dark-mode .input-wrapper input:focus {
    border-color: #D4AF37;
    background: #332525;
    box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.18);
  }

  .input-icon {
    position: absolute;
    left: 15px;
    top: 50%;
    transform: translateY(-50%);
    width: 18px;
    height: 18px;
    fill: #a89a8a;
    pointer-events: none;
    transition: fill 0.3s ease;
  }

  .input-wrapper input:focus ~ .input-icon {
    fill: #7B1113;
  }

  body.dark-mode .input-wrapper input:focus ~ .input-icon {
    fill: #D4AF37;
  }

  .toggle-password {
    position: absolute;
    right: 15px;
    top: 50%;
    transform: translateY(-50%);
    width: 20px;
    height: 20px;
    cursor: pointer;
    fill: #a89a8a;
    transition: fill 0.3s ease;
  }

  .toggle-password:hover {
    fill: #7B1113;
  }

  body.dark-mode .toggle-password:hover {
    fill: #D4AF37;
  }

  /* =========================================================
     OPTIONS ROW
     ========================================================= */
  .options-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 25px;
    font-size: 0.83rem;
  }

  .remember {
    display: flex;
    align-items: center;
    gap: 7px;
    color: #5A0C0E;
    cursor: pointer;
    user-select: none;
    font-weight: 500;
    transition: color 0.5s ease;
  }

  body.dark-mode .remember { color: #e8d9b0; }

  .remember input {
    appearance: none;
    width: 16px;
    height: 16px;
    border: 1.5px solid #7B1113;
    border-radius: 4px;
    background: transparent;
    cursor: pointer;
    position: relative;
    transition: all 0.25s ease;
  }

  body.dark-mode .remember input { border-color: #D4AF37; }

  .remember input:checked {
    background: #7B1113;
    border-color: #7B1113;
  }

  body.dark-mode .remember input:checked {
    background: #D4AF37;
    border-color: #D4AF37;
  }

  .remember input:checked::after {
    content: '';
    position: absolute;
    left: 4px;
    top: 1px;
    width: 5px;
    height: 9px;
    border: solid #D4AF37;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }

  body.dark-mode .remember input:checked::after {
    border-color: #1a1414;
  }

  .forgot-link {
    color: #7B1113;
    text-decoration: none;
    font-weight: 600;
    transition: color 0.3s ease;
  }

  body.dark-mode .forgot-link { color: #D4AF37; }

  .forgot-link:hover {
    color: #D4AF37;
    text-decoration: underline;
  }

  body.dark-mode .forgot-link:hover { color: #F4C430; }

  /* =========================================================
     BUTTON
     ========================================================= */
  .btn-login {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #7B1113 0%, #5A0C0E 100%);
    color: #D4AF37;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 8px 20px rgba(123, 17, 19, 0.35);
    position: relative;
    overflow: hidden;
    border-bottom: 3px solid #D4AF37;
  }

  body.dark-mode .btn-login {
    background: linear-gradient(135deg, #D4AF37 0%, #b8942a 100%);
    color: #1a1414;
    box-shadow: 0 8px 20px rgba(212, 175, 55, 0.35);
  }

  .btn-login::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.25), transparent);
    transition: left 0.5s ease;
  }

  .btn-login:hover:not(:disabled)::before {
    left: 100%;
  }

  .btn-login:hover:not(:disabled) {
    transform: translateY(-2px);
    background: linear-gradient(135deg, #8d1517 0%, #6b0f12 100%);
    box-shadow: 0 12px 25px rgba(123, 17, 19, 0.5);
  }

  body.dark-mode .btn-login:hover:not(:disabled) {
    background: linear-gradient(135deg, #F4C430 0%, #D4AF37 100%);
  }

  .btn-login:active:not(:disabled) {
    transform: translateY(0);
  }

  .btn-login:disabled {
    opacity: 0.75;
    cursor: not-allowed;
  }

  .btn-login .btn-text {
    display: inline-block;
    transition: opacity 0.2s ease;
  }

  .btn-login .spinner {
    display: none;
    width: 18px;
    height: 18px;
    border: 2.5px solid rgba(212, 175, 55, 0.3);
    border-top-color: #D4AF37;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin: 0 auto;
  }

  body.dark-mode .btn-login .spinner {
    border: 2.5px solid rgba(26, 20, 20, 0.3);
    border-top-color: #1a1414;
  }

  .btn-login.loading .btn-text { display: none; }
  .btn-login.loading .spinner  { display: block; }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* =========================================================
     MESSAGES
     ========================================================= */
  .error-message,
  .success-message {
    display: none;
    padding: 11px 14px;
    border-radius: 8px;
    font-size: 0.85rem;
    margin-bottom: 18px;
    text-align: center;
    font-weight: 500;
    animation: shake 0.4s ease;
  }

  .error-message {
    background: rgba(123, 17, 19, 0.08);
    border: 1.5px solid #7B1113;
    color: #7B1113;
  }

  body.dark-mode .error-message {
    background: rgba(255, 71, 87, 0.12);
    border-color: #ff6b7a;
    color: #ff8b96;
  }

  .success-message {
    background: rgba(212, 175, 55, 0.12);
    border: 1.5px solid #D4AF37;
    color: #8a6d1f;
  }

  body.dark-mode .success-message {
    background: rgba(212, 175, 55, 0.15);
    border-color: #D4AF37;
    color: #F4C430;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25%      { transform: translateX(-6px); }
    75%      { transform: translateX(6px); }
  }

  /* =========================================================
     FOOTER
     ========================================================= */
  .footer-text {
    text-align: center;
    color: #8a7a6a;
    font-size: 0.75rem;
    margin-top: 28px;
    line-height: 1.6;
    border-top: 1px solid #eadfc9;
    padding-top: 18px;
    transition: border-color 0.5s ease;
  }

  body.dark-mode .footer-text {
    border-top-color: #3d2a2a;
  }

  .footer-text .gold {
    color: #D4AF37;
    font-weight: 700;
  }

  /* =========================================================
     RESPONSIVE
     ========================================================= */
  @media (max-width: 480px) {
    .login-container {
      padding: 35px 25px;
      border-radius: 16px;
    }
    .logo-area h1 { font-size: 0.95rem; }
    .logo-circle { width: 92px; height: 92px; }
    .logo-circle .fallback-icon { width: 45px; height: 45px; }
    body::before { filter: blur(4px) brightness(0.85); }
    body.dark-mode::before { filter: blur(4px) brightness(0.4); }
    .theme-toggle {
      width: 42px;
      height: 42px;
      top: 14px;
      right: 14px;
    }
    .theme-toggle svg { width: 20px; height: 20px; }
  }
</style>
</head>
<body>

  <!-- ============================================================
       DARK MODE TOGGLE
       ============================================================ -->
  <button
    class="theme-toggle"
    id="themeToggle"
    aria-label="Toggle dark mode"
    title="Toggle dark mode"
    type="button"
  >
    <svg class="icon-sun" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 7a5 5 0 100 10 5 5 0 000-10zm0-5a1 1 0 011 1v2a1 1 0 11-2 0V3a1 1 0 011-1zm0 18a1 1 0 011 1v2a1 1 0 11-2 0v-2a1 1 0 011-1zM4.22 4.22a1 1 0 011.42 0l1.42 1.42a1 1 0 11-1.42 1.42L4.22 5.64a1 1 0 010-1.42zm12.72 12.72a1 1 0 011.42 0l1.42 1.42a1 1 0 11-1.42 1.42l-1.42-1.42a1 1 0 010-1.42zM2 12a1 1 0 011-1h2a1 1 0 110 2H3a1 1 0 01-1-1zm18 0a1 1 0 011-1h2a1 1 0 110 2h-2a1 1 0 01-1-1zM4.22 19.78a1 1 0 010-1.42l1.42-1.42a1 1 0 111.42 1.42l-1.42 1.42a1 1 0 01-1.42 0zM16.94 7.06a1 1 0 010-1.42l1.42-1.42a1 1 0 111.42 1.42l-1.42 1.42a1 1 0 01-1.42 0z"/>
    </svg>
    <svg class="icon-moon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M21.64 13a1 1 0 00-1.05-.14 8.05 8.05 0 01-3.37.73 8.15 8.15 0 01-8.14-8.1 8.59 8.59 0 01.25-2A1 1 0 008 2.36a10.14 10.14 0 1014 11.69 1 1 0 00-.36-1.05z"/>
    </svg>
  </button>

  <!-- ============================================================
       LOGIN CARD
       ============================================================ -->
  <div class="login-container">

    <!-- LOGO SLOT -->
    <div class="logo-area">
      <div class="logo-circle" id="logoCircle">
        <!-- 👇 REPLACE "uphsd-logo.png" WITH YOUR ACTUAL LOGO FILENAME 👇 -->
        <img
          id="schoolLogo"
          src="uphsd-logo.png"
          alt="UPHSD Molino Campus Logo"
        />
        <svg class="fallback-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3zM5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"/>
        </svg>
      </div>

      <h1>
        University of Perpetual Help System DALTA<br/>
        <span class="campus">Molino Campus</span>
      </h1>
      <span class="subtitle">Office of the School Director</span>
    </div>

    <!-- Message boxes -->
    <div id="errorBox" class="error-message"></div>
    <div id="successBox" class="success-message"></div>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="email">Email Address</label>
        <div class="input-wrapper">
          <input
            type="email"
            id="email"
            name="email"
            placeholder="your.email@perpetual.edu.ph"
            autocomplete="username"
            required
          />
          <svg class="input-icon" viewBox="0 0 24 24">
            <path d="M20 4H4a2 2 0 00-2 2v12a2 2 0 002 2h16a2 2 0 002-2V6a2 2 0 00-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
          </svg>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          />
          <svg class="input-icon" viewBox="0 0 24 24">
            <path d="M12 1a5 5 0 00-5 5v3H6a2 2 0 00-2 2v9a2 2 0 002 2h12a2 2 0 002-2v-9a2 2 0 00-2-2h-1V6a5 5 0 00-5-5zm-3 8V6a3 3 0 116 0v3H9zm3 6a2 2 0 110 4 2 2 0 010-4z"/>
          </svg>
          <svg class="toggle-password" id="togglePassword" viewBox="0 0 24 24">
            <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zm0 12.5a5 5 0 110-10 5 5 0 010 10zm0-8a3 3 0 100 6 3 3 0 000-6z"/>
          </svg>
        </div>
      </div>

      <div class="options-row">
        <label class="remember">
          <input type="checkbox" id="rememberMe" />
          Remember my email
        </label>
        <a href="#" class="forgot-link" id="forgotLink">Forgot password?</a>
      </div>

      <button type="submit" class="btn-login" id="loginBtn">
        <span class="btn-text">Sign In</span>
        <span class="spinner"></span>
      </button>
    </form>

    <p class="footer-text">
      &copy; <span id="year"></span> <span class="gold">UPHSD Molino Campus</span><br/>
      Office of the School Director — Authorized Personnel Only
    </p>
  </div>

  <!-- ============================================================
       PAGE SCRIPT
       ============================================================ -->
  <script src="app.js"></script>
  <script>
  /* ==========================================================================
     LOGIN PAGE — Uses APP.Auth from app.js
     ========================================================================== */
  (function () {
    'use strict';

    const { Auth, Theme, Toast, Utils, Storage, APP } = window;

    /* --------------------------------------------------------------------
       Element references
       -------------------------------------------------------------------- */
    const form        = document.getElementById('loginForm');
    const emailInput  = document.getElementById('email');
    const passInput   = document.getElementById('password');
    const togglePass  = document.getElementById('togglePassword');
    const loginBtn    = document.getElementById('loginBtn');
    const errorBox    = document.getElementById('errorBox');
    const successBox  = document.getElementById('successBox');
    const forgotLink  = document.getElementById('forgotLink');
    const rememberMe  = document.getElementById('rememberMe');
    const themeToggle = document.getElementById('themeToggle');
    const logoCircle  = document.getElementById('logoCircle');
    const schoolLogo  = document.getElementById('schoolLogo');

    // Set current year
    document.getElementById('year').textContent = new Date().getFullYear();

    /* --------------------------------------------------------------------
       If already logged in → skip login page
       -------------------------------------------------------------------- */
    APP.Auth.skipLoginIfLoggedIn();

    /* --------------------------------------------------------------------
       LOGO FALLBACK
       -------------------------------------------------------------------- */
    if (schoolLogo) {
      schoolLogo.addEventListener('error', () => {
        logoCircle.classList.add('img-failed');
      });
      schoolLogo.addEventListener('load', () => {
        logoCircle.classList.remove('img-failed');
      });
    }

    /* --------------------------------------------------------------------
       DARK MODE TOGGLE
       -------------------------------------------------------------------- */
    themeToggle.addEventListener('click', () => {
      Theme.toggle();
    });

    /* --------------------------------------------------------------------
       PASSWORD VISIBILITY TOGGLE
       -------------------------------------------------------------------- */
    togglePass.addEventListener('click', () => {
      const isPassword = passInput.type === 'password';
      passInput.type = isPassword ? 'text' : 'password';
      const isDark = document.body.classList.contains('dark-mode');
      togglePass.style.fill = isPassword
        ? (isDark ? '#D4AF37' : '#7B1113')
        : '#a89a8a';
    });

    /* --------------------------------------------------------------------
       MESSAGE HELPERS
       -------------------------------------------------------------------- */
    function showError(message, duration = 4500) {
      errorBox.textContent = message;
      errorBox.style.display = 'block';
      successBox.style.display = 'none';
      if (duration) setTimeout(() => { errorBox.style.display = 'none'; }, duration);
    }

    function showSuccess(message, duration = 2500) {
      successBox.textContent = message;
      successBox.style.display = 'block';
      errorBox.style.display = 'none';
      if (duration) setTimeout(() => { successBox.style.display = 'none'; }, duration);
    }

    function hideMessages() {
      errorBox.style.display = 'none';
      successBox.style.display = 'none';
    }

    /* --------------------------------------------------------------------
       LOADING STATE
       -------------------------------------------------------------------- */
    function setLoading(isLoading) {
      loginBtn.disabled = isLoading;
      loginBtn.classList.toggle('loading', isLoading);
    }

    /* --------------------------------------------------------------------
       REMEMBER EMAIL — pre-fill from storage
       -------------------------------------------------------------------- */
    (function loadRememberedEmail() {
      const saved = Storage.get(APP.APP ? APP.APP.keys.rememberEmail : 'uphsdDirectorEmail');
      if (saved) {
        emailInput.value = saved;
        rememberMe.checked = true;
      }
    })();

    /* --------------------------------------------------------------------
       FORM SUBMISSION — real auth
       -------------------------------------------------------------------- */
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideMessages();

      const email    = emailInput.value.trim();
      const password = passInput.value;

      // ---- Client-side validation ----
      if (!email) {
        showError('Please enter your email address.');
        emailInput.focus();
        return;
      }
      if (!Utils.isValidEmail(email)) {
        showError('Please enter a valid email address.');
        emailInput.focus();
        return;
      }
      if (!password) {
        showError('Please enter your password.');
        passInput.focus();
        return;
      }

      // ---- Handle "Remember me" ----
      if (rememberMe.checked) {
        Storage.set('uphsdDirectorEmail', email);
      } else {
        Storage.remove('uphsdDirectorEmail');
      }

      // ---- Show loading ----
      setLoading(true);

      try {
        const result = await window.APP.Auth.login(email, password);

        if (!result.success) {
          setLoading(false);
          showError(result.message || 'Login failed. Please try again.');
          passInput.value = '';
          passInput.focus();
          return;
        }

        // ---- Success ----
        showSuccess(`Welcome, ${result.user.name}! Redirecting...`);

        // Redirect after a short delay
        setTimeout(() => {
          window.APP.Auth.redirectAfterLogin();
        }, 900);

      } catch (err) {
        console.error('[Login] Unexpected error:', err);
        setLoading(false);
        showError('An unexpected error occurred. Please try again.');
      }
    });

    /* --------------------------------------------------------------------
       FORGOT PASSWORD (placeholder)
       -------------------------------------------------------------------- */
    forgotLink.addEventListener('click', (e) => {
      e.preventDefault();
      hideMessages();
      showSuccess('Please contact the School Director\'s Office to reset your password.');
    });

    /* --------------------------------------------------------------------
       CLEAR ERROR ON INPUT
       -------------------------------------------------------------------- */
    [emailInput, passInput].forEach(input => {
      input.addEventListener('input', () => {
        errorBox.style.display = 'none';
      });
    });

    /* --------------------------------------------------------------------
       ENTER KEY — allow submitting from anywhere in the form
       -------------------------------------------------------------------- */
    [emailInput, passInput].forEach(input => {
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          form.requestSubmit();
        }
      });
    });

    /* --------------------------------------------------------------------
       AUTO-FOCUS email field
       -------------------------------------------------------------------- */
    window.addEventListener('DOMContentLoaded', () => {
      if (!emailInput.value) emailInput.focus();
      else passInput.focus();
    });

  })();
  </script>
</body>
</html>
